name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [burn-in-camera, burn-in-fixed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and Kotlin/Java compilation
        run: bash scripts/check.sh "${{ matrix.project }}"
      - name: Retain test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-checks
          path: |
            ${{ matrix.project }}/app/build/reports/
            ${{ matrix.project }}/app/build/test-results/
